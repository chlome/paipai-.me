<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お支払い・受け取り画面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* スマホの画面枠 */
        .phone-screen {
            width: 100%;
            max-width: 380px;
            height: 700px;
            background: linear-gradient(135deg, #ff7e79 0%, #ff5252 100%);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            color: white;
            position: relative;
            overflow: hidden;
        }
        /* ユーザーアイコン */
        .user-icon {
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .user-icon svg {
            width: 35px;
            height: 35px;
            fill: #00bcd4;
        }
        .receive-text {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        /* 金額 */
        .amount {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        /* 完了ボタン */
        .complete-btn {
            background-color: #00c853;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,200,83,0.4);
            transition: 0.2s;
            margin-bottom: 30px;
            width: 80%;
        }
        .complete-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        /* 下部の詳細カード */
        .detail-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            margin-top: auto;
        }
        .detail-line {
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            margin-bottom: 12px;
        }
        .detail-line.short {
            width: 40%;
        }
        .detail-line.medium {
            width: 70%;
        }
        .detail-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="phone-screen">
        <!-- ユーザーアイコン（簡易SVG） -->
        <div class="user-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <div class="receive-text">やまとから受け取り</div>
        <div class="amount">10,000円</div>

        <button class="complete-btn" onclick="alert('受け取りが完了しました！');">受け取り完了</button>

        <!-- 下部のレシート・詳細風デザイン -->
        <div class="detail-card">
            <div class="detail-line short"></div>
            <div class="detail-line medium"></div>
            <div class="detail-line medium"></div>
            <div class="detail-divider"></div>
            <div class="detail-line medium"></div>
            <div class="detail-line short"></div>
        </div>
    </div>

</body>
</html>
