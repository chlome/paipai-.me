<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <!-- LINEやチャット等でリンクを送ったときのプレビューを非表示・空にする設定 -->
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta name="twitter:card" content="summary">
    <style>
        /* 基本設定 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* スマホの画面枠 */
        .phone-screen {
            width: 100%;
            max-width: 380px;
            height: 700px;
            background: linear-gradient(135deg, #ff7e79 0%, #ff5252 100%);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            box-sizing: border-box;
            color: white;
            position: relative;
            overflow: hidden;
        }

        /* ユーザーアイコン */
        .user-icon {
            width: 70px;
            height: 70px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .user-icon svg {
            width: 40px;
            height: 40px;
            fill: #555555;
        }

        .receive-text {
            font-size: 15px;
            margin-bottom: 10px;
            opacity: 0.9;
            font-weight: 300;
        }

        /* 金額 */
        .amount {
            font-size: 42px;
            font-weight: 600; 
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        /* 完了ボタン */
        .complete-btn {
            background-color: #00c853;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 18px 40px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,200,83,0.4);
            transition: all 0.2s;
            margin-bottom: 35px;
            width: 85%;
        }
        .complete-btn:hover {
            background-color: #00e676;
            transform: translateY(-2px);
        }

        /* 下部の詳細カード */
        .detail-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            margin-top: auto;
        }

        /* テキスト行 */
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
            opacity: 0.85;
            font-weight: 300;
        }
        .detail-row span:last-child {
            font-weight: 500;
        }

        .detail-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.25);
            margin: 15px 0;
        }
        
        .detail-line {
            height: 8px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .detail-line.short {
            width: 40%;
        }
    </style>
</head>
<body>

    <div class="phone-screen">
        <!-- ユーザーアイコン -->
        <div class="user-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <div class="receive-text">大和さんから受け取り</div>
        <div class="amount">10,000円</div>

        <button class="complete-btn" onclick="alert('受け取りが完了しました！');">受け取り完了</button>

        <!-- 下部の詳細カード -->
        <div class="detail-card">
            <div class="detail-row">
                <span>取引日時</span>
                <span>2026年10月4日</span>
            </div>
            <div class="detail-row">
                <span>入金予定日</span>
                <span>2026年10月8日</span>
            </div>
            <div class="detail-divider"></div>
            <div class="detail-line short"></div>
        </div>
    </div>

</body>
</html>
